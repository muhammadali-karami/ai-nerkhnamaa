<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نرخ‌نما</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <a class="brand" href="https://nerkhnamaa.ir" target="_blank" rel="noreferrer" aria-label="باز کردن سایت نرخ‌نما"><img src="icons/favicon.svg" alt="" /><strong>نرخ‌نما</strong></a>
        <div class="header-actions"><button id="theme-toggle" type="button" aria-label="فعال‌سازی حالت تیره">☾</button><button id="refresh" type="button" aria-label="بروزرسانی قیمت‌ها">↻</button></div>
      </header>
      <nav class="tabs" role="tablist" aria-label="انتخاب بازار">
        <button type="button" role="tab" data-market="gold" aria-selected="true">طلای ۱۸ عیار</button>
        <button type="button" role="tab" data-market="usd" aria-selected="false">دلار آمریکا</button>
        <button type="button" role="tab" data-market="usdt" aria-selected="false">تتر</button>
      </nav>
      <section class="summary" aria-live="polite"><span id="label">قیمت میانگین</span><strong id="average">—</strong><small id="updated">در حال دریافت اطلاعات…</small></section>
      <section id="sources" class="sources" aria-live="polite"></section>
      <p id="notice" class="notice" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
